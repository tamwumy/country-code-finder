<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>國碼快查｜Country Code Finder</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#11192b; --muted:#8aa0b5; --text:#eaf1f8; --accent:#59b1ff; --accent-2:#9be28c; --danger:#ff6b6b;
      --chip:#18233a; --chip-border:#23324e;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans TC", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 1200px at 85% -10%, #11224455, transparent 70%), var(--bg);
      color:var(--text);
      line-height:1.6;
    }
    a{color:inherit}
    .container{max-width:1000px;margin:0 auto;padding:24px}
    header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .logo{
      width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
      background:linear-gradient(135deg,#2e7fd6,#59b1ff 60%,#b1e3ff);
      color:#07121e;font-weight:900; letter-spacing:1px;
      box-shadow:0 8px 24px #1b2a44aa;
    }
    h1{font-size:22px;margin:0}
    .sub{color:var(--muted);font-size:14px}

    .surface{background:var(--panel);border:1px solid #182849;border-radius:16px;padding:16px;box-shadow:0 12px 40px #0006}

    .tabs{display:flex;gap:8px;margin-top:12px}
    .tab{padding:8px 12px;border-radius:999px;background:transparent;border:1px solid #2a3c5f;color:var(--muted);cursor:pointer}
    .tab.active{background:#193052;border-color:#2f74ff3d;color:#cfe7ff}

    .searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .searchbar input{flex:1;min-width:220px;padding:14px 14px;border-radius:12px;border:1px solid #213455;background:#0d1729;color:var(--text);outline:none}
    .searchbar input::placeholder{color:#7b94ac}
    .btn{padding:12px 14px;border-radius:12px;border:1px solid #2a3c5f;background:#173157;color:#cfe7ff;font-weight:600;cursor:pointer}
    .btn:hover{filter:brightness(1.05)}
    .btn.secondary{background:#16243d}
    .btn.ghost{background:transparent}

    .section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 8px}
    .section-title h3{margin:0;font-size:16px;color:#bcd4ea}
    .muted{color:var(--muted);font-size:13px}

    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{padding:8px 12px;border-radius:999px;border:1px solid var(--chip-border);background:var(--chip);display:flex;gap:8px;align-items:center;cursor:pointer}
    .chip .code{font-weight:700;color:#bfe4ff}
    .chip .name{color:#cfe0f1}
    .chip .remove{color:#9fb3c7;border-left:1px dashed #2b3c5a;padding-left:8px;cursor:pointer}

    .results{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
    .card{background:#0e192d;border:1px solid #223559;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
    .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
    .country{font-weight:700}
    .code{font-weight:800;color:#bde0ff}
    .tag{font-size:12px;color:#99b1c8;background:#16233d;padding:2px 8px;border-radius:999px;border:1px solid #263b5f}
    .tools{display:flex;gap:8px}
    .iconbtn{border:1px solid #2b3e62;background:#14264a;color:#cfe7ff;border-radius:10px;padding:8px 10px;cursor:pointer}
    .iconbtn.fav.active{background:#1d3b1f;border-color:#2c5d31;color:#a5f3a5}
    .nores{padding:10px 12px;border:1px dashed #2b3e62;border-radius:12px;background:#0d182b;color:#9fb3c7}

    footer{margin-top:28px;color:#8aa0b5;font-size:12px;text-align:center}
    .kbd{border:1px solid #2b3e62;border-bottom-width:3px;padding:2px 6px;border-radius:6px;background:#0d182b;font-weight:700}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">CC</div>
      <div>
        <h1>國碼快查 <span class="sub">｜Country Code Finder</span></h1>
        <div class="sub">輸入 <span class="kbd">+國碼</span> 反查國家，或輸入 <span class="kbd">國家/地區名稱</span> 查其國碼。可收藏常用，重啟仍在。</div>
      </div>
    </header>

    <section class="surface" style="margin-top:16px">
      <div class="tabs">
        <button class="tab active" id="tab-auto">🔍 自動判斷</button>
        <button class="tab" id="tab-code">📞 用國碼找國家</button>
        <button class="tab" id="tab-country">🌍 用國家找國碼</button>
      </div>
      <div class="searchbar">
        <input id="q" type="text" inputmode="text" placeholder="例：+91 或 印度、澳洲、United States…" />
        <button class="btn" id="btnSearch">搜尋</button>
        <button class="btn secondary" id="btnClear">清除</button>
      </div>

      <div class="section-title">
        <h3>★ 收藏的常用國家碼</h3>
        <div class="muted" id="favCount"></div>
      </div>
      <div class="chips" id="favorites"></div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" id="btnExport">匯出收藏</button>
        <input id="importFile" type="file" accept="application/json" style="display:none" />
        <button class="btn ghost" id="btnImport">匯入收藏</button>
        <button class="btn ghost" id="btnReset">清空收藏</button>
      </div>

      <div class="section-title" style="margin-top:18px">
        <h3>搜尋結果</h3>
        <div class="muted">提示：輸入「台灣、臺灣、台湾、TW、United States、USA、UK…」皆可。</div>
      </div>
      <div id="results" class="results"></div>
      <div id="empty" class="nores" style="display:none">尚未有結果。輸入 <b>+886</b> 看看會出現什麼？</div>
    </section>

    <footer>
      <p>資料為內建參考列表（E.164 國碼）。部分地區共用國碼（如 +1、+44 等），反查會列出多個結果。</p>
    </footer>
  </div>

  <script>
  // --- Utility ---
  const $ = sel => document.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));
  const norm = s => (s||"")
    .toString()
    .toLowerCase()
    .normalize('NFD')
    .replace(/\p{Diacritic}/gu,'')
    .replace(/\s+/g,'')
    .trim();
  const onlyDigitsPlus = s => '+' + (s.match(/\d+/g)||[]).join('');

  // --- Data (compressed pipe format: code|en|zh|alt1,alt2,alt3) ---
  const RAW = `

  const DATA = RAW.trim().split(/\n+/).map(line=>{
    const [code,en,zh,altStr] = line.split('|');
    const alt = (altStr||'').split(',').map(s=>s.trim()).filter(Boolean);
    return {code:code.trim(), en:en.trim(), zh:(zh||'').trim(), alt};
  });

  // --- Favorites ---
  const FAV_KEY = 'cc_favorites_v1';
  const loadFav = () => {
    try{ return JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); }catch{ return []; }
  };
  const saveFav = list => localStorage.setItem(FAV_KEY, JSON.stringify(list));
  let favorites = loadFav();

  function favId(item){ return `${item.code}|${item.en}`; }
  function isFav(item){ return favorites.some(f=>favId(f)===favId(item)); }
  function toggleFav(item){
    if(isFav(item)) favorites = favorites.filter(f=>favId(f)!==favId(item));
    else favorites = [{...item}, ...favorites].slice(0,100);
    saveFav(favorites); renderFav(); renderResults(currentResults);
  }

  function renderFav(){
    const box = $('#favorites');
    box.innerHTML = '';
    $('#favCount').textContent = favorites.length? `${favorites.length} 個收藏` : '尚未收藏';
    favorites.forEach((f,i)=>{
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerHTML = `<span class="code">${f.code}</span><span class="name">${f.zh||f.en}</span><span class="remove" title="移除收藏">✕</span>`;
      chip.addEventListener('click', (e)=>{
        if(e.target.classList.contains('remove')){
          favorites.splice(i,1); saveFav(favorites); renderFav(); return;
        }
        // click chip: run a search for that code
        $('#q').value = f.code; doSearch();
      });
      box.appendChild(chip);
    });
  }

  // --- Search ---
  let mode = 'auto'; // auto | code | country
  let currentResults = [];

  function matchCountry(q){
    const nq = norm(q);
    return DATA.filter(d=>{
      const hay = [d.en, d.zh, ...(d.alt||[])].map(norm).join('|');
      return hay.includes(nq) || hay.indexOf(nq) >= 0 || norm(d.en).includes(nq) || norm(d.zh).includes(nq) || (d.alt||[]).some(a=>norm(a).includes(nq));
    }).sort((a,b)=> norm(a.en).startsWith(nq)? -1 : 1);
  }

  function matchCode(q){
    const qc = onlyDigitsPlus(q);
    return DATA.filter(d=> d.code===qc || d.code.startsWith(qc) || qc.startsWith(d.code))
               .sort((a,b)=> (a.code===qc? -1:1));
  }

  function renderResults(list){
    currentResults = list;
    const box = $('#results'); box.innerHTML='';
    $('#empty').style.display = list.length? 'none' : 'block';
    list.forEach(item=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="row"><div class="country">${item.zh||''} <span class="muted">${item.en}</span></div><span class="tag">E.164</span></div>
        <div class="row"><div class="code">${item.code}</div>
          <div class="tools">
            <button class="iconbtn copy">複製</button>
            <button class="iconbtn fav ${isFav(item)?'active':''}">${isFav(item)?'★ 已收藏':'☆ 收藏'}</button>
          </div>
        </div>`;
      card.querySelector('.copy').addEventListener('click',()=>{
        navigator.clipboard.writeText(`${item.code}`).then(()=>{
          card.querySelector('.copy').textContent = '已複製';
          setTimeout(()=>card.querySelector('.copy').textContent='複製',1000);
        });
      });
      card.querySelector('.fav').addEventListener('click',()=>toggleFav(item));
      box.appendChild(card);
    });
  }

  function doSearch(){
    const qv = $('#q').value.trim();
    if(!qv){ renderResults([]); return; }
    let res = [];
    if(mode==='code') res = matchCode(qv);
    else if(mode==='country') res = matchCountry(qv);
    else{
      // auto: detect by first char
      res = /^\+|^\d/.test(qv)? matchCode(qv) : matchCountry(qv);
    }
    renderResults(res);
  }

  // --- Events ---
  $('#btnSearch').addEventListener('click', doSearch);
  $('#btnClear').addEventListener('click', ()=>{ $('#q').value=''; renderResults([]); $('#q').focus(); });
  $('#q').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });

  $('#tab-auto').addEventListener('click',()=>{ mode='auto'; setTabs(); $('#q').placeholder='例：+91 或 印度、澳洲、United States…'; $('#q').focus(); });
  $('#tab-code').addEventListener('click',()=>{ mode='code'; setTabs(); $('#q').placeholder='輸入例如：+61、+1、+886…'; $('#q').focus(); });
  $('#tab-country').addEventListener('click',()=>{ mode='country'; setTabs(); $('#q').placeholder='輸入國家/地區：台灣、澳洲、United States…'; $('#q').focus(); });
  function setTabs(){ $$('.tab').forEach(t=>t.classList.remove('active')); if(mode==='code') $('#tab-code').classList.add('active'); else if(mode==='country') $('#tab-country').classList.add('active'); else $('#tab-auto').classList.add('active'); }

  // import/export/reset favorites
  $('#btnExport').addEventListener('click',()=>{
    const blob = new Blob([JSON.stringify(favorites,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='country-code-favorites.json'; a.click(); URL.revokeObjectURL(url);
  });
  $('#btnImport').addEventListener('click',()=> $('#importFile').click());
  $('#importFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    try{ const arr = JSON.parse(text); if(Array.isArray(arr)){ favorites = arr.filter(x=>x && x.code && x.en); saveFav(favorites); renderFav(); }
    }catch(err){ alert('匯入失敗：檔案不是有效的 JSON'); }
    e.target.value='';
  });
  $('#btnReset').addEventListener('click',()=>{ if(confirm('清空所有收藏？')){ favorites=[]; saveFav(favorites); renderFav(); } });

  // first paint
  renderFav();
  renderResults([]);
  </script>
</body>
</html>
